# All settings are environment driven (12-factor). Defaults target a local developer setup
# (docker compose infrastructure on localhost). Spring's own keys (SPRING_DATASOURCE_URL, SERVER_PORT,
# LOGGING_STRUCTURED_FORMAT_CONSOLE, ...) can be overridden directly via relaxed binding.
spring:
  application:
    name: ppap-connector
  config:
    import: classpath:masterdata-import-synonyms.yaml
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ppap
    username: ppap
    password: ppap
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${PPAP_UPLOAD_MAX_SIZE:50MB}
      max-request-size: ${PPAP_UPLOAD_MAX_SIZE:50MB}
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: CONNECTOR_ADMIN
      group:
        liveness:
          include: livenessState
        # EDC, object storage and DTR are deliberately not part of readiness: the UI must stay
        # available and report degraded partner connectivity instead of being taken out of rotation.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  # JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or activate the "json-logs" profile).

ppap:
  tenant:
    bpnl: ${PPAP_TENANT_BPNL:BPNL000000000OEM}
    name: ${PPAP_TENANT_NAME:Local Development OEM}
    role-label: ${PPAP_TENANT_ROLE_LABEL:OEM}
    did: ${PPAP_TENANT_DID:}
  oidc:
    issuer-uri: ${PPAP_OIDC_ISSUER_URI:http://localhost:8180/realms/oem}
    jwk-set-uri: ${PPAP_OIDC_JWK_SET_URI:http://localhost:8180/realms/oem/protocol/openid-connect/certs}
    public-authority: ${PPAP_OIDC_PUBLIC_AUTHORITY:}
    client-id: ${PPAP_OIDC_CLIENT_ID:ppap-ui}
  cors:
    allowed-origins: ${PPAP_CORS_ALLOWED_ORIGINS:}
  edc:
    management-url: ${PPAP_EDC_MANAGEMENT_URL:http://localhost:8081/management}
    api-key: ${PPAP_EDC_API_KEY:}
    dsp-url: ${PPAP_EDC_DSP_URL:http://localhost:8084/api/v1/dsp}
    participant-id: ${PPAP_EDC_PARTICIPANT_ID:${ppap.tenant.bpnl}}
    # base URL under which the own data plane reaches this backend, and the shared secret it sends
    callback-base-url: ${PPAP_EDC_CALLBACK_BASE_URL:}
    callback-secret: ${PPAP_EDC_CALLBACK_SECRET:}
    policy:
      usage-purpose: ${PPAP_EDC_POLICY_USAGE_PURPOSE:cx.quality.base:1}
    # the participant's vault, read by the EDC data plane (DataAddress secretName); same as the signing key vault
    vault:
      url: ${PPAP_VAULT_URL:}
      token: ${PPAP_VAULT_TOKEN:}
      kv-mount: ${PPAP_VAULT_KV_MOUNT:secret}
  exchange:
    worker-interval: ${PPAP_EXCHANGE_WORKER_INTERVAL:2s}
    max-attempts: ${PPAP_EXCHANGE_MAX_ATTEMPTS:20}
  seed:
    enabled: ${PPAP_SEED_ENABLED:false}
    path: ${PPAP_SEED_PATH:}
    common-path: ${PPAP_SEED_COMMON_PATH:}
    documents-path: ${PPAP_SEED_DOCUMENTS_PATH:}
  documents:
    max-size: ${PPAP_UPLOAD_MAX_SIZE:50MB}
  # Payload signatures (ADR-0008). Startup fails if the key cannot be loaded; "generated" is for development only.
  signing:
    provider: ${PPAP_SIGNING_PROVIDER:vault}
    key-file: ${PPAP_SIGNING_KEY_FILE:}
    vault:
      url: ${PPAP_VAULT_URL:}
      token: ${PPAP_VAULT_TOKEN:}
      kv-mount: ${PPAP_VAULT_KV_MOUNT:secret}
      key-path: ${PPAP_SIGNING_KEY_PATH:ppap-signing-key}
      field: content
  decision:
    allow-technical-clients: ${PPAP_DECISION_ALLOW_TECHNICAL_CLIENTS:false}
    # unset = no recent-login check; otherwise auth_time must be younger than this many seconds
    max-auth-age-seconds: ${PPAP_DECISION_MAX_AUTH_AGE_SECONDS:}
  approval:
    form-import:
      max-file-size: 10MB
      max-rows: 500
      attach-to-element: ${PPAP_FORM_IMPORT_ATTACH_ELEMENT:PPF-01}
  storage:
    endpoint: ${PPAP_S3_ENDPOINT:http://localhost:8333}
    region: ${PPAP_S3_REGION:us-east-1}
    access-key: ${PPAP_S3_ACCESS_KEY:}
    secret-key: ${PPAP_S3_SECRET_KEY:}
    bucket: ${PPAP_S3_BUCKET:ppap-local}
    path-style: ${PPAP_S3_PATH_STYLE:true}
    create-bucket: ${PPAP_S3_CREATE_BUCKET:false}

---
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
