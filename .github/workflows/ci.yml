name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: includes the dataspace end-to-end smoke test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, modularity, OpenAPI contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (Testcontainers, ArchUnit, Modulith, Spotless)
        run: ./mvnw -B verify
      - name: OpenAPI contract up to date
        run: git diff --exit-code api/openapi.json || (echo "::error::api/openapi.json is outdated – run ./mvnw verify and commit it" && exit 1)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            backend/app/target/surefire-reports
            backend/app/target/failsafe-reports
            backend/app/target/site/jacoco
            backend/app/target/spring-modulith-docs
          retention-days: 14

  frontend:
    name: Frontend (lint, types, tests, API client drift, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - name: Generated API client matches api/openapi.json
        run: npm run api:check
      - run: npm run build

  seed:
    name: Seed data consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 seed/check_seed.py

  security:
    name: Dependency & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerabilities (Maven + npm lockfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Licenses (commercial product – no copyleft in shipped code, see ASSUMPTIONS A-31)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: "1"

  e2e-smoke:
    name: Dataspace smoke test (real EDCs)
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start dataspace (OEM + Tier-1)
        run: make up
      - name: EDC end-to-end (catalog, negotiation, EDR, data plane)
        run: make smoke
      - name: Container logs
        if: failure()
        run: docker compose -f infra/compose.yaml --env-file infra/.env.example logs --tail=300
      - name: Tear down
        if: always()
        run: make clean
