# msg CX PPAP Connector – local dataspace (docker compose)
#
# Participants: OEM and Tier-1 (default), Tier-2 (profile "tier2").
# Each participant has its own EDC (control + data plane), its own secret store (OpenBao) and its own
# databases. Participant networks are isolated; only EDC protocol/public endpoints and the shared
# identity services are attached to the "dataspace" network (see docs/ARCHITECTURE.md §7).
#
# Versions: docs/versions.md, docs/tractusx-versions.md. All values overridable via .env.

name: ppap

x-edc-common: &edc-common
  EDC_IAM_DID_WEB_USE_HTTPS: "false"
  EDC_IAM_STS_OAUTH_TOKEN_URL: http://wallet-stub/oauth/token
  EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: client-secret
  TX_EDC_IAM_STS_DIV_URL: http://wallet-stub/api/sts
  EDC_VAULT_HASHICORP_TOKEN: ${VAULT_ROOT_TOKEN:-root}
  EDC_VAULT_HASHICORP_API_SECRET_PATH: /v1/secret
  EDC_VAULT_HASHICORP_HEALTH_CHECK_STANDBY_OK: "true"
  EDC_DATASOURCE_DEFAULT_USER: edc
  EDC_DATASOURCE_DEFAULT_PASSWORD: ${EDC_DB_PASSWORD:-edc-local}

x-edc-controlplane: &edc-controlplane
  <<: *edc-common
  WEB_HTTP_PORT: "8080"
  WEB_HTTP_PATH: /api
  WEB_HTTP_MANAGEMENT_PORT: "8081"
  WEB_HTTP_MANAGEMENT_PATH: /management
  WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
  WEB_HTTP_MANAGEMENT_AUTH_KEY: ${EDC_MANAGEMENT_API_KEY:-local-management-key}
  WEB_HTTP_CONTROL_PORT: "8083"
  WEB_HTTP_CONTROL_PATH: /control
  WEB_HTTP_PROTOCOL_PORT: "8084"
  WEB_HTTP_PROTOCOL_PATH: /api/v1/dsp
  EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID: did:web:wallet-stub:${OPERATOR_BPNL:-BPNL00000OPERATR}
  TX_EDC_IAM_DCP_BDRS_SERVER_URL: http://wallet-stub/api/v1/directory
  TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: http://wallet-stub/api
  TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED: "false"
  EDC_POLICY_VALIDATION_ENABLED: "true"

x-edc-dataplane: &edc-dataplane
  <<: *edc-common
  WEB_HTTP_PORT: "8080"
  WEB_HTTP_PATH: /api
  WEB_HTTP_PUBLIC_PORT: "8081"
  WEB_HTTP_PUBLIC_PATH: /api/public
  WEB_HTTP_CONTROL_PORT: "8084"
  WEB_HTTP_CONTROL_PATH: /api/control
  EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: tokenSignerPrivateKey
  EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: tokenSignerPublicKey

x-edc-cp-service: &edc-cp-service
  image: tractusx/edc-controlplane-postgresql-hashicorp-vault:${EDC_VERSION:-0.13.0}
  restart: unless-stopped
  mem_limit: 1g
  healthcheck:
    # readiness instead of liveness: /api/check/liveness sporadically answers 404 right after start (EDC 0.13)
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/check/readiness"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

x-edc-dp-service: &edc-dp-service
  image: tractusx/edc-dataplane-hashicorp-vault:${EDC_VERSION:-0.13.0}
  restart: unless-stopped
  mem_limit: 768m

x-vault-service: &vault-service
  image: openbao/openbao:${OPENBAO_VERSION:-2.7.2}
  restart: unless-stopped
  mem_limit: 256m
  command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=${VAULT_ROOT_TOKEN:-root}"]
  cap_add: [IPC_LOCK]
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"]
    interval: 5s
    retries: 20

x-vault-seed: &vault-seed
  # reuses the wallet-stub image because it already ships curl + openssl (no package install needed)
  image: tractusx/ssi-dim-wallet-stub:${WALLET_STUB_VERSION:-0.1.0}
  restart: "no"
  user: "0"
  entrypoint: ["/bin/sh", "/bootstrap/seed-vault.sh"]
  volumes:
    - ./bootstrap:/bootstrap:ro

x-app-service: &app-service
  image: ${APP_IMAGE:-ppap-connector:local}
  restart: unless-stopped
  mem_limit: 768m
  healthcheck:
    # the JRE base image has no curl/wget – plain bash HTTP request
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 40s

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${APP_SPRING_PROFILES:-}
  # JSON (ECS) logs with correlation id; set to empty for human-readable logs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${APP_LOG_FORMAT:-ecs}
  SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app-local}
  PPAP_OIDC_CLIENT_ID: ppap-ui
  PPAP_EDC_API_KEY: ${EDC_MANAGEMENT_API_KEY:-local-management-key}
  PPAP_S3_ENDPOINT: http://seaweedfs:8333
  PPAP_S3_CREATE_BUCKET: "true"
  # Seed data (seed/<participant>, seed/common) is loaded through the regular import services on start
  PPAP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
  PPAP_SEED_PATH: /seed/participant
  PPAP_SEED_COMMON_PATH: /seed/common
  PPAP_SEED_DOCUMENTS_PATH: /seed/documents
  # Signing key for submissions/decisions (JWS, ADR-0008) from the participant's OpenBao
  PPAP_SIGNING_PROVIDER: vault
  PPAP_SIGNING_KEY_PATH: ppap-signing-key
  PPAP_VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root}
  # EDC exchange (docs/api/exchange-api.md)
  PPAP_EDC_POLICY_USAGE_PURPOSE: ${EDC_USAGE_PURPOSE:-cx.quality.base:1}
  # Decisions/review by technical clients only for automated live tests (UC-07: a person confirms). Enable with
  # APP_DECISION_ALLOW_TECHNICAL_CLIENTS=true make up ... before running ExchangeLiveTest.
  PPAP_DECISION_ALLOW_TECHNICAL_CLIENTS: ${APP_DECISION_ALLOW_TECHNICAL_CLIENTS:-false}
  # Mode PULL: how often a customer polls its suppliers' DTRs for open requests (docs/api/pull-api.md)
  PPAP_PULL_POLL_INTERVAL: ${APP_PULL_POLL_INTERVAL:-60s}

x-dtr-service: &dtr-service
  image: tractusx/sldt-digital-twin-registry:${DTR_VERSION:-0.13.0}
  # the DTR image is published for amd64 only; on Apple Silicon Docker Desktop runs it via Rosetta emulation
  platform: linux/amd64
  restart: unless-stopped
  mem_limit: 768m

x-dtr-env: &dtr-env
  SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
  SPRING_DATASOURCE_PASSWORD: ${DTR_DB_PASSWORD:-dtr-local}
  REGISTRY_IDM_PUBLIC_CLIENT_ID: ppap-dtr
  REGISTRY_USE_GRANULAR_ACCESS_CONTROL: "false"
  REGISTRY_EXTERNAL_SUBJECT_ID_WILDCARD_PREFIX: PUBLIC_READABLE
  REGISTRY_EXTERNAL_SUBJECT_ID_WILDCARD_ALLOWED_TYPES: manufacturerPartId,assetLifecyclePhase

services:
  # ------------------------------------------------------------------ shared
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.7}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      # db:user:password – one EDC database per participant
      POSTGRES_MULTIPLE_DATABASES: >-
        keycloak:keycloak:${KEYCLOAK_DB_PASSWORD:-keycloak-local},
        oem_edc:edc_oem:${EDC_DB_PASSWORD:-edc-local},tier1_edc:edc_tier1:${EDC_DB_PASSWORD:-edc-local},tier2_edc:edc_tier2:${EDC_DB_PASSWORD:-edc-local},
        oem_app:app_oem:${APP_DB_PASSWORD:-app-local},tier1_app:app_tier1:${APP_DB_PASSWORD:-app-local},tier2_app:app_tier2:${APP_DB_PASSWORD:-app-local},
        tier1_dtr:dtr_tier1:${DTR_DB_PASSWORD:-dtr-local},tier2_dtr:dtr_tier2:${DTR_DB_PASSWORD:-dtr-local}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    networks: [net-oem, net-tier1, net-tier2, net-shared]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # Simulated Catena-X identity services: STS, DCP credential service, did:web documents, BPN directory.
  # Must listen on port 80 – did:web resolution (EDC_IAM_DID_WEB_USE_HTTPS=false) uses the default port.
  wallet-stub:
    image: tractusx/ssi-dim-wallet-stub:${WALLET_STUB_VERSION:-0.1.0}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      APPLICATION_PORT: "80"
      STUB_ENV: local
      DID_HOST: wallet-stub
      STUB_URL: http://wallet-stub
      BASE_WALLET_BPN: ${OPERATOR_BPNL:-BPNL00000OPERATR}
      SEED_WALLETS_BPN: ${OEM_BPNL:-BPNL00000000OEM1},${TIER1_BPNL:-BPNL000000TIER01},${TIER2_BPNL:-BPNL000000TIER02}
      TOKEN_EXPIRY_TIME: "60"
      APP_LOG_LEVEL: INFO
    ports: ["${WALLET_STUB_HOST_PORT:-8090}:80"]
    networks: [dataspace]

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.2}
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      # Browser-facing issuer; containers use keycloak:8080 for back-channel calls (JWKS, token endpoint)
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports: ["${KEYCLOAK_HOST_PORT:-8180}:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    # net-tier1/net-tier2: the participants' data planes obtain OAuth2 tokens for their DTR (asset ppap-dtr)
    networks: [net-shared, net-tier1, net-tier2]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
      start_period: 30s

  # S3-compatible object storage (ADR-0007); one bucket + credentials per participant (seaweedfs/s3.json)
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.54}
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=256"]
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["${S3_HOST_PORT:-8333}:8333"]
    networks: [net-shared]

  # ------------------------------------------------------------------ OEM
  oem-vault:
    <<: *vault-service
    networks: [net-oem]
  oem-vault-seed:
    <<: *vault-seed
    environment: { VAULT_ADDR: "http://oem-vault:8200", VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-root}", STS_CLIENT_SECRET: "${STS_CLIENT_SECRET:-not-validated-by-stub}" }
    depends_on: { oem-vault: { condition: service_healthy } }
    networks: [net-oem]
  oem-edc-cp:
    <<: *edc-cp-service
    environment:
      <<: *edc-controlplane
      EDC_RUNTIME_ID: oem-edc-cp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000001
      TRACTUSX_EDC_PARTICIPANT_BPN: ${OEM_BPNL:-BPNL00000000OEM1}
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${OEM_BPNL:-BPNL00000000OEM1}
      EDC_CONTROL_ENDPOINT: http://oem-edc-cp:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://oem-edc-cp:8084/api/v1/dsp
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/oem_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_oem
      EDC_VAULT_HASHICORP_URL: http://oem-vault:8200
    depends_on:
      postgres: { condition: service_healthy }
      oem-vault-seed: { condition: service_completed_successfully }
      wallet-stub: { condition: service_started }
    ports: ["${OEM_EDC_MGMT_HOST_PORT:-8191}:8081"]
    networks: [net-oem, dataspace]
  oem-edc-dp:
    <<: *edc-dp-service
    environment:
      <<: *edc-dataplane
      EDC_RUNTIME_ID: oem-edc-dp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000001
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${OEM_BPNL:-BPNL00000000OEM1}
      EDC_CONTROL_ENDPOINT: http://oem-edc-dp:8084/api/control
      EDC_DPF_SELECTOR_URL: http://oem-edc-cp:8083/control/v1/dataplanes
      EDC_DATAPLANE_API_PUBLIC_BASEURL: http://oem-edc-dp:8081/api/public
      TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: http://oem-edc-dp:8081/api/public/token
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/oem_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_oem
      EDC_VAULT_HASHICORP_URL: http://oem-vault:8200
    depends_on:
      oem-edc-cp: { condition: service_healthy }
    networks: [net-oem, dataspace]

  oem-app:
    <<: *app-service
    environment:
      <<: *app-env
      PPAP_TENANT_BPNL: ${OEM_BPNL:-BPNL00000000OEM1}
      PPAP_TENANT_NAME: "Demo-OEM AG"
      PPAP_TENANT_ROLE_LABEL: OEM
      PPAP_TENANT_DID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oem_app
      SPRING_DATASOURCE_USERNAME: app_oem
      PPAP_OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/oem
      PPAP_OIDC_JWK_SET_URI: http://keycloak:8080/realms/oem/protocol/openid-connect/certs
      PPAP_EDC_MANAGEMENT_URL: http://oem-edc-cp:8081/management
      PPAP_EDC_DSP_URL: http://oem-edc-cp:8084/api/v1/dsp/2025-1
      PPAP_EDC_PARTICIPANT_ID: did:web:wallet-stub:${OEM_BPNL:-BPNL00000000OEM1}
      PPAP_S3_ACCESS_KEY: oem-local
      PPAP_S3_SECRET_KEY: oem-local-secret
      PPAP_S3_BUCKET: oem-documents
      PPAP_VAULT_URL: http://oem-vault:8200
      PPAP_EDC_CALLBACK_BASE_URL: http://oem-app:8080
      PPAP_EDC_CALLBACK_SECRET: ${OEM_EDC_CALLBACK_SECRET:-oem-callback-local-secret}
      PPAP_EDC_DATAPLANE_PUBLIC_URL: http://oem-edc-dp:8081/api/public
    volumes:
      - ../seed/oem:/seed/participant:ro
      - ../seed/common:/seed/common:ro
      - ../seed/documents:/seed/documents:ro
    ports: ["${OEM_APP_HOST_PORT:-8081}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      oem-edc-cp: { condition: service_healthy }
      oem-vault-seed: { condition: service_completed_successfully }
    # dataspace: outbound to partner data planes (public API), see docs/api/exchange-api.md §6
    networks: [net-oem, net-shared, dataspace]

  # ------------------------------------------------------------------ Tier-1
  tier1-vault:
    <<: *vault-service
    networks: [net-tier1]
  tier1-vault-seed:
    <<: *vault-seed
    environment: { VAULT_ADDR: "http://tier1-vault:8200", VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-root}", STS_CLIENT_SECRET: "${STS_CLIENT_SECRET:-not-validated-by-stub}" }
    depends_on: { tier1-vault: { condition: service_healthy } }
    networks: [net-tier1]
  tier1-edc-cp:
    <<: *edc-cp-service
    environment:
      <<: *edc-controlplane
      EDC_RUNTIME_ID: tier1-edc-cp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000002
      TRACTUSX_EDC_PARTICIPANT_BPN: ${TIER1_BPNL:-BPNL000000TIER01}
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${TIER1_BPNL:-BPNL000000TIER01}
      EDC_CONTROL_ENDPOINT: http://tier1-edc-cp:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://tier1-edc-cp:8084/api/v1/dsp
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/tier1_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_tier1
      EDC_VAULT_HASHICORP_URL: http://tier1-vault:8200
    depends_on:
      postgres: { condition: service_healthy }
      tier1-vault-seed: { condition: service_completed_successfully }
      wallet-stub: { condition: service_started }
    ports: ["${TIER1_EDC_MGMT_HOST_PORT:-8291}:8081"]
    networks: [net-tier1, dataspace]
  tier1-edc-dp:
    <<: *edc-dp-service
    environment:
      <<: *edc-dataplane
      EDC_RUNTIME_ID: tier1-edc-dp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000002
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${TIER1_BPNL:-BPNL000000TIER01}
      EDC_CONTROL_ENDPOINT: http://tier1-edc-dp:8084/api/control
      EDC_DPF_SELECTOR_URL: http://tier1-edc-cp:8083/control/v1/dataplanes
      EDC_DATAPLANE_API_PUBLIC_BASEURL: http://tier1-edc-dp:8081/api/public
      TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: http://tier1-edc-dp:8081/api/public/token
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/tier1_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_tier1
      EDC_VAULT_HASHICORP_URL: http://tier1-vault:8200
    depends_on:
      tier1-edc-cp: { condition: service_healthy }
    networks: [net-tier1, dataspace]
  tier1-app:
    <<: *app-service
    environment:
      <<: *app-env
      PPAP_TENANT_BPNL: ${TIER1_BPNL:-BPNL000000TIER01}
      PPAP_TENANT_NAME: "Demo-Tier1 GmbH"
      PPAP_TENANT_ROLE_LABEL: Tier-1
      PPAP_TENANT_DID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tier1_app
      SPRING_DATASOURCE_USERNAME: app_tier1
      PPAP_OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/tier1
      PPAP_OIDC_JWK_SET_URI: http://keycloak:8080/realms/tier1/protocol/openid-connect/certs
      PPAP_EDC_MANAGEMENT_URL: http://tier1-edc-cp:8081/management
      PPAP_EDC_DSP_URL: http://tier1-edc-cp:8084/api/v1/dsp/2025-1
      PPAP_EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER1_BPNL:-BPNL000000TIER01}
      PPAP_S3_ACCESS_KEY: tier1-local
      PPAP_S3_SECRET_KEY: tier1-local-secret
      PPAP_S3_BUCKET: tier1-documents
      PPAP_VAULT_URL: http://tier1-vault:8200
      PPAP_EDC_CALLBACK_BASE_URL: http://tier1-app:8080
      PPAP_EDC_CALLBACK_SECRET: ${TIER1_EDC_CALLBACK_SECRET:-tier1-callback-local-secret}
      PPAP_EDC_DATAPLANE_PUBLIC_URL: http://tier1-edc-dp:8081/api/public
      PPAP_DTR_URL: http://tier1-dtr:4243/api/v3
      # phase 5 (docs/api/pull-api.md): backend registers twins, the own data plane serves the DTR to partners
      PPAP_DTR_PUBLIC_URL: http://tier1-dtr:4243/api/v3
      PPAP_DTR_TOKEN_URL: http://keycloak:8080/realms/tier1/protocol/openid-connect/token
      PPAP_DTR_CLIENT_SECRET: ${TIER1_DTR_BACKEND_SECRET:-tier1-ppap-backend-dtr-local-secret}
      PPAP_DTR_EDC_CLIENT_SECRET: ${TIER1_DTR_EDC_SECRET:-tier1-ppap-edc-dtr-local-secret}
    volumes:
      - ../seed/tier1:/seed/participant:ro
      - ../seed/common:/seed/common:ro
      - ../seed/documents:/seed/documents:ro
    ports: ["${TIER1_APP_HOST_PORT:-8082}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      tier1-edc-cp: { condition: service_healthy }
      tier1-vault-seed: { condition: service_completed_successfully }
    # dataspace: outbound to partner data planes (public API), see docs/api/exchange-api.md §6
    networks: [net-tier1, net-shared, dataspace]
  tier1-dtr:
    <<: *dtr-service
    environment:
      <<: *dtr-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tier1_dtr
      SPRING_DATASOURCE_USERNAME: dtr_tier1
      REGISTRY_IDM_OWNING_TENANT_ID: ${TIER1_BPNL:-BPNL000000TIER01}
      # JWKS via internal URL; the backend obtains its tokens via keycloak:8080 (back-channel)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tier1/protocol/openid-connect/certs
    depends_on:
      postgres: { condition: service_healthy }
    networks: [net-tier1, net-shared]

  # ------------------------------------------------------------------ Tier-2 (profile tier2)
  tier2-vault:
    profiles: [tier2]
    <<: *vault-service
    networks: [net-tier2]
  tier2-vault-seed:
    profiles: [tier2]
    <<: *vault-seed
    environment: { VAULT_ADDR: "http://tier2-vault:8200", VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-root}", STS_CLIENT_SECRET: "${STS_CLIENT_SECRET:-not-validated-by-stub}" }
    depends_on: { tier2-vault: { condition: service_healthy } }
    networks: [net-tier2]
  tier2-edc-cp:
    profiles: [tier2]
    <<: *edc-cp-service
    environment:
      <<: *edc-controlplane
      EDC_RUNTIME_ID: tier2-edc-cp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000003
      TRACTUSX_EDC_PARTICIPANT_BPN: ${TIER2_BPNL:-BPNL000000TIER02}
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${TIER2_BPNL:-BPNL000000TIER02}
      EDC_CONTROL_ENDPOINT: http://tier2-edc-cp:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://tier2-edc-cp:8084/api/v1/dsp
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/tier2_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_tier2
      EDC_VAULT_HASHICORP_URL: http://tier2-vault:8200
    depends_on:
      postgres: { condition: service_healthy }
      tier2-vault-seed: { condition: service_completed_successfully }
      wallet-stub: { condition: service_started }
    ports: ["${TIER2_EDC_MGMT_HOST_PORT:-8391}:8081"]
    networks: [net-tier2, dataspace]
  tier2-edc-dp:
    profiles: [tier2]
    <<: *edc-dp-service
    environment:
      <<: *edc-dataplane
      EDC_RUNTIME_ID: tier2-edc-dp
      EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      EDC_IAM_ISSUER_ID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      EDC_PARTICIPANT_CONTEXT_ID: 6b0c3f4e-0e57-4d55-9a0a-000000000003
      EDC_IAM_STS_OAUTH_CLIENT_ID: ${TIER2_BPNL:-BPNL000000TIER02}
      EDC_CONTROL_ENDPOINT: http://tier2-edc-dp:8084/api/control
      EDC_DPF_SELECTOR_URL: http://tier2-edc-cp:8083/control/v1/dataplanes
      EDC_DATAPLANE_API_PUBLIC_BASEURL: http://tier2-edc-dp:8081/api/public
      TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: http://tier2-edc-dp:8081/api/public/token
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/tier2_edc
      EDC_DATASOURCE_DEFAULT_USER: edc_tier2
      EDC_VAULT_HASHICORP_URL: http://tier2-vault:8200
    depends_on:
      tier2-edc-cp: { condition: service_healthy }
    networks: [net-tier2, dataspace]
  tier2-app:
    profiles: [tier2]
    <<: *app-service
    environment:
      <<: *app-env
      PPAP_TENANT_BPNL: ${TIER2_BPNL:-BPNL000000TIER02}
      PPAP_TENANT_NAME: "Demo-Tier2 KG"
      PPAP_TENANT_ROLE_LABEL: Tier-2
      PPAP_TENANT_DID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tier2_app
      SPRING_DATASOURCE_USERNAME: app_tier2
      PPAP_OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/tier2
      PPAP_OIDC_JWK_SET_URI: http://keycloak:8080/realms/tier2/protocol/openid-connect/certs
      PPAP_EDC_MANAGEMENT_URL: http://tier2-edc-cp:8081/management
      PPAP_EDC_DSP_URL: http://tier2-edc-cp:8084/api/v1/dsp/2025-1
      PPAP_EDC_PARTICIPANT_ID: did:web:wallet-stub:${TIER2_BPNL:-BPNL000000TIER02}
      PPAP_S3_ACCESS_KEY: tier2-local
      PPAP_S3_SECRET_KEY: tier2-local-secret
      PPAP_S3_BUCKET: tier2-documents
      PPAP_VAULT_URL: http://tier2-vault:8200
      PPAP_EDC_CALLBACK_BASE_URL: http://tier2-app:8080
      PPAP_EDC_CALLBACK_SECRET: ${TIER2_EDC_CALLBACK_SECRET:-tier2-callback-local-secret}
      PPAP_EDC_DATAPLANE_PUBLIC_URL: http://tier2-edc-dp:8081/api/public
      PPAP_DTR_URL: http://tier2-dtr:4243/api/v3
      # phase 5 (docs/api/pull-api.md): backend registers twins, the own data plane serves the DTR to partners
      PPAP_DTR_PUBLIC_URL: http://tier2-dtr:4243/api/v3
      PPAP_DTR_TOKEN_URL: http://keycloak:8080/realms/tier2/protocol/openid-connect/token
      PPAP_DTR_CLIENT_SECRET: ${TIER2_DTR_BACKEND_SECRET:-tier2-ppap-backend-dtr-local-secret}
      PPAP_DTR_EDC_CLIENT_SECRET: ${TIER2_DTR_EDC_SECRET:-tier2-ppap-edc-dtr-local-secret}
    volumes:
      - ../seed/tier2:/seed/participant:ro
      - ../seed/common:/seed/common:ro
      - ../seed/documents:/seed/documents:ro
    ports: ["${TIER2_APP_HOST_PORT:-8083}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      tier2-edc-cp: { condition: service_healthy }
      tier2-vault-seed: { condition: service_completed_successfully }
    # dataspace: outbound to partner data planes (public API), see docs/api/exchange-api.md §6
    networks: [net-tier2, net-shared, dataspace]
  tier2-dtr:
    profiles: [tier2]
    <<: *dtr-service
    environment:
      <<: *dtr-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tier2_dtr
      SPRING_DATASOURCE_USERNAME: dtr_tier2
      REGISTRY_IDM_OWNING_TENANT_ID: ${TIER2_BPNL:-BPNL000000TIER02}
      # JWKS via internal URL; the backend obtains its tokens via keycloak:8080 (back-channel)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tier2/protocol/openid-connect/certs
    depends_on:
      postgres: { condition: service_healthy }
    networks: [net-tier2, net-shared]

networks:
  dataspace: {}
  net-shared: {}
  net-oem: {}
  net-tier1: {}
  net-tier2: {}

volumes:
  pg-data: {}
  s3-data: {}
